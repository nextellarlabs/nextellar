name: Bug report
description: Something in the CLI, a template, or the docs is wrong.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - cli
        - templates
        - docs
        - ci
        - tests
    validations:
      required: true
  - type: dropdown
    id: complexity
    attributes:
      label: Complexity
      description: Rough size of the fix. Used by the Stellar Wave checklist.
      options:
        - Small
        - Medium
        - High
    validations:
      required: true
  - type: checkboxes
    id: wave
    attributes:
      label: Stellar Wave checklist
      description: Confirm what a fix for this bug needs to include.
      options:
        - label: Tests (unit, template, or a note that none apply)
          required: true
        - label: Docs (README, CONTRIBUTING, SECURITY, or docs/)
          required: true
        - label: Complexity above matches the work
          required: true
