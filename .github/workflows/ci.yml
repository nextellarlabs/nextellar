name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

  package:
    name: Build and verify package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: npm run verify:pack

  e2e-default:
    name: E2E — default scaffold + next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Scope to the default-template E2E only (#858). `npm run test:e2e` runs
      # the whole tests/e2e suite (default + js + templates) — each a real npm
      # install + next build — which won't fit in one PR job. Run jest against
      # just the default test, with the same env the test:e2e script sets.
      - name: Run E2E test (default template scaffold → install → next build)
        run: NEXTELLAR_E2E=1 NODE_OPTIONS="--experimental-vm-modules --no-warnings" npx jest tests/e2e/scaffold-default.e2e.test.ts
        timeout-minutes: 15

  pack-guard:
    name: npm pack size guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run build

      # Pack size thresholds (~2× clean main): max 5 MB tarball, 25 MB unpacked, 1000 files
      - run: node scripts/check-pack-size.mjs

  coverage:
    name: Test coverage report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # `npm run test:coverage` (see package.json) so this stays in sync with
      # the same NODE_OPTIONS/ESM setup `npm test` uses locally. This
      # intentionally does not delegate test execution to the coverage
      # action itself: re-deriving this repo's ESM flags inside a
      # third-party action's own test runner would be fragile.
      - name: Run tests with coverage
        run: npm run test:coverage

      # Publishes a coverage summary as a PR comment. Runs even if the tests
      # step above reported failures, so coverage is still visible on red
      # PRs (this repo has pre-existing failing suites on main unrelated to
      # any given PR's diff; see CONTRIBUTING.md).
      - name: Report coverage on PR
        if: always() && github.event_name == 'pull_request'
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          coverage-file: ./coverage/report.json
          skip-step: all
