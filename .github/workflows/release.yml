name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and pack without publishing"
        type: boolean
        required: false
        default: false

# Release signing (#1127):
# - id-token: write   lets npm publish with --provenance (Sigstore-signed
#                     provenance tied to this workflow run) and lets
#                     attest-build-provenance request a signing certificate.
# - attestations: write  stores the signed build provenance for the tarball
#                     and SBOM, verifiable with `gh attestation verify`.
# - contents: write   creates the GitHub Release the signed artifacts and
#                     checksums are attached to.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag version v$TAG_VERSION matches package.json version $PKG_VERSION"

      - name: Pack-size guard
        run: |
          npm pack --dry-run > /dev/null
          PACKAGE_SIZE=$(npm pack --dry-run --json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'))[0].size")
          MAX_SIZE=5242880
          echo "Package size: $PACKAGE_SIZE bytes"
          if [ "$PACKAGE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::Package size $PACKAGE_SIZE exceeds $MAX_SIZE byte limit"
            exit 1
          fi
          echo "Package size $PACKAGE_SIZE is within limit"

      # Branch names (dry-run from workflow_dispatch) may contain "/", which
      # upload-artifact rejects in artifact names.
      - name: Compute artifact-safe ref name
        id: ref
        run: echo "name=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Generate Software Bill of Materials (SBOM)
        run: npx @cyclonedx/cyclonedx-npm --output-file bom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.ref.outputs.name }}
          path: bom.json

      # The exact tarball packed here is the one that is attested, attached
      # to the GitHub Release, and published to npm, so every signature and
      # checksum refers to the same bytes.
      - name: Create tarball and checksums
        id: pack
        run: |
          TARBALL=$(npm pack --silent | tail -n 1)
          sha256sum "$TARBALL" bom.json > SHA256SUMS
          cat SHA256SUMS
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Upload tarball
        if: ${{ inputs['dry-run'] }}
        uses: actions/upload-artifact@v4
        with:
          name: nextellar-${{ steps.ref.outputs.name }}
          path: |
            ${{ steps.pack.outputs.tarball }}
            SHA256SUMS

      - name: Sign build provenance for release artifacts
        if: ${{ startsWith(github.ref, 'refs/tags/') && !inputs['dry-run'] }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ steps.pack.outputs.tarball }}
            bom.json

      # Tag refs only, so a manual workflow_dispatch on a branch can never publish.
      - name: Publish to npm
        if: ${{ startsWith(github.ref, 'refs/tags/') && !inputs['dry-run'] }}
        run: npm publish "${{ steps.pack.outputs.tarball }}" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm provenance was recorded
        if: ${{ startsWith(github.ref, 'refs/tags/') && !inputs['dry-run'] }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for attempt in 1 2 3 4 5 6; do
            ATTESTATIONS=$(npm view "nextellar@$VERSION" dist.attestations --json 2>/dev/null || true)
            if [ -n "$ATTESTATIONS" ] && [ "$ATTESTATIONS" != "{}" ]; then
              echo "npm provenance recorded for nextellar@$VERSION"
              exit 0
            fi
            echo "Waiting for registry to report provenance (attempt $attempt)..."
            sleep 10
          done
          echo "::error::nextellar@$VERSION was published without npm provenance attestations"
          exit 1

      - name: Attach signed artifacts to GitHub Release
        if: ${{ !inputs['dry-run'] && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$TARBALL" bom.json SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$TARBALL" bom.json SHA256SUMS \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
