name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # TruffleHog diffs between these two refs on a PR; a full clone
          # (rather than the default shallow one) is required for it to
          # resolve both commits, especially on a PR with more than one
          # commit.
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.90.8
        with:
          # On a PR, scan only the commits introduced by the PR (base..head)
          # so pre-existing history isn't re-flagged on every run. On a
          # direct push to main, scan the pushed range; fall back to
          # scanning the full history for any other trigger (e.g. a manual
          # re-run with no computable diff).
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '') }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified --fail
