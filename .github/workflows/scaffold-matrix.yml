name: Scaffold Matrix

# Trigger strategy (see issue #678):
# - pull_request: fast smoke pass, ubuntu + Node 20 only, all 5 template variants.
#   Keeps PR-blocking time to one OS/Node combo x 5 variants instead of the full 30.
# - schedule (nightly) + workflow_dispatch: full matrix across all OS x Node x variant
#   combinations, catching platform-specific regressions without blocking every PR.

on:
  pull_request:
    paths:
      - "src/templates/**"
      - "src/lib/scaffold.ts"
      - "bin/**"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  # Only needs git + the repo's preinstalled Node, so it runs once right after
  # checkout, before any `npm ci`, and gates the matrix jobs below.
  template-junk:
    name: template junk guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check template junk
        run: node scripts/check-template-junk.mjs

  pr-smoke:
    needs: template-junk
    if: github.event_name == 'pull_request'
    name: smoke (${{ matrix.variant.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20]
        variant:
          - { name: default, args: "--template default" }
          - { name: minimal, args: "--template minimal" }
          - { name: defi, args: "--template defi" }
          - { name: default-js, args: "--template default --javascript" }
          - {
              name: with-contracts,
              args: "--template default --with-contracts",
            }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      - run: npm run build
      - name: Scaffold app
        shell: bash
        run: |
          node dist/bin/nextellar.js scaffolded-app --defaults --skip-install ${{ matrix.variant.args }}
      - name: Install + build generated app
        shell: bash
        working-directory: scaffolded-app
        run: |
          npm install
          npm run build
          if grep -q '"build-storybook"' package.json; then npm run build-storybook; fi

  windows-long-path:
    # Scaffolds into a deeply nested directory addressed with backslashes, past the 260
    # character MAX_PATH limit, then checks placeholder replacement and .gitignore handling (#1492).
    # Any failure fails the workflow: there is no continue-on-error here.
    needs: template-junk
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: windows long path (${{ matrix.variant.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { name: default, args: "--template default" }
          - { name: default-js, args: "--template default --javascript" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Enable long paths
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1
          git config --system core.longpaths true
      - run: npm ci
      - run: npm run build
      - name: Scaffold into a deeply nested directory
        shell: pwsh
        run: |
          $segments = 1..14 | ForEach-Object { 'nested-directory-level-{0:d2}' -f $_ }
          $parent = Join-Path $env:RUNNER_TEMP ($segments -join '\')
          New-Item -ItemType Directory -Path $parent -Force | Out-Null
          Write-Host "parent path length: $($parent.Length)"
          if ($parent.Length -lt 260) { throw "parent path is $($parent.Length) characters, not past MAX_PATH" }
          Push-Location $parent
          node "$env:GITHUB_WORKSPACE\dist\bin\nextellar.js" long-path-app --defaults --skip-install ${{ matrix.variant.args }}
          if ($LASTEXITCODE -ne 0) { throw "scaffold failed with exit code $LASTEXITCODE" }
          Pop-Location
          "APP_DIR=$parent\long-path-app" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify placeholders and .gitignore
        shell: pwsh
        run: node scripts/verify-scaffold-output.mjs "$env:APP_DIR" long-path-app --min-path-length=260

  bundle-budgets:
    # Runs once (not matrixed) since scripts/analyze-template-bundles.mjs
    # already iterates every template itself. See docs/bundle-budgets.md
    # for why `defi` is excluded (its CounterDemo imports a @/lib/contracts
    # module that doesn't exist in the template yet, a pre-existing
    # correctness bug unrelated to bundle size, tracked separately) and why
    # this wasn't wired into CI sooner (#1286).
    needs: template-junk
    if: github.event_name == 'pull_request'
    name: bundle budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/analyze-template-bundles.mjs --template=default
      - run: node scripts/analyze-template-bundles.mjs --template=minimal
      - run: node scripts/analyze-template-bundles.mjs --template=js-template
      - run: node scripts/analyze-template-bundles.mjs --template=js-defi

  nightly-full:
    needs: template-junk
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: full (${{ matrix.os }}, node ${{ matrix.node }}, ${{ matrix.variant.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
        variant:
          - { name: default, args: "--template default" }
          - { name: minimal, args: "--template minimal" }
          - { name: defi, args: "--template defi" }
          - { name: default-js, args: "--template default --javascript" }
          - {
              name: with-contracts,
              args: "--template default --with-contracts",
            }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      - run: npm run build
      - name: Scaffold app
        shell: bash
        run: |
          node dist/bin/nextellar.js scaffolded-app --defaults --skip-install ${{ matrix.variant.args }}
      - name: Install + build generated app
        shell: bash
        working-directory: scaffolded-app
        run: |
          npm install
          npm run build
          if grep -q '"build-storybook"' package.json; then npm run build-storybook; fi
