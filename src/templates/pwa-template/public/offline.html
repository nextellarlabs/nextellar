<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1020" />
    <title>Offline · Nextellar</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --fg: #f5f3ff;
        --muted: #a5a3c4;
        --accent: #c4b5fd;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 0%, #221046, var(--bg) 65%);
        color: var(--fg);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 32rem;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 10px 20px;
        border-radius: 999px;
        background: var(--accent);
        color: #1b1140;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid var(--fg);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        This shell is cached so the app still loads without a network
        connection. Wallet data, balances and transactions need a live
        connection — they are never cached.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
