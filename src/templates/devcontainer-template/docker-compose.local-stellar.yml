services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - .:/workspaces/${localWorkspaceFolderBasename}:cached
    depends_on:
      - stellar-local

  stellar-local:
    image: stellar/quickstart:latest
    command: --standalone --enable-soroban-rpc
    ports:
      - "8000:8000"
      - "8001:8001"
      - "11625:11625"
      - "11626:11626"
    environment:
      - LOG_LEVEL=info
    volumes:
      - stellar_standalone_data:/opt/stellar
    restart: unless-stopped

volumes:
  stellar_standalone_data:
